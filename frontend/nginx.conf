# Serves the built UI and reverse-proxies /api to incident-service, so the browser sees ONE origin: no CORS needed.
# Runs as non-root (nginxinc/nginx-unprivileged) on 8080. In Kubernetes the Ingress routes /api to incident-service
# directly and / to this container; the /api block here is then simply not used.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers for the UI. connect-src 'self': the UI can only call its own origin (/api).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # with the port, as the browser sent it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets: cache for a year (the name changes with the content).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/incidents, /incidents/<id>, ...) all get index.html, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
