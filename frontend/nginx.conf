# Serves the built UI and reverse-proxies /api to incident-service, so the browser sees ONE origin: no CORS needed.
# Runs as non-root (nginxinc/nginx-unprivileged) on 8080. In Kubernetes the Ingress routes /api to incident-service
# directly and / to this container; the /api block here is then simply not used.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers for the UI. connect-src 'self': the UI can only call its own origin (/api).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Re-resolve the API's address while running. With a literal host in proxy_pass, nginx resolves it once at start,
    # so a recreated incident-service (new container IP) gave 502s until this container was restarted. With a variable,
    # nginx asks the resolver at request time and caches the answer for 10 s. The resolver is the container's own DNS
    # (Docker's embedded 127.0.0.11 in compose, kube-dns in Kubernetes): the image's 15-local-resolvers.envsh reads it
    # from /etc/resolv.conf into NGINX_LOCAL_RESOLVERS (enabled in the Dockerfile).
    # Note: nginx's resolver does not apply resolv.conf search domains, so API_UPSTREAM must be resolvable as written
    # (a compose service name, or the full *.svc.cluster.local name in Kubernetes).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    resolver_timeout 3s;

    location /api/ {
        set $api_upstream http://${API_UPSTREAM};
        proxy_pass $api_upstream;   # no URI part: the original request URI is passed unchanged, as before
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # with the port, as the browser sent it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets: cache for a year (the name changes with the content).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/incidents, /incidents/<id>, ...) all get index.html, never cached.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
