# Local Kubernetes cluster for ai-incident-platform (section 3.5): kind create cluster --config k8s/kind-config.yaml
# 1 control plane (also runs ingress-nginx: it gets host ports 80/443 and the ingress-ready label) + 2 workers
# for the application pods. Node image pinned by digest (kind v0.33.0's default, Kubernetes v1.37.0).
# The default CNI (kindnet) enforces NetworkPolicy since kind v0.24, so no extra CNI is needed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-platform
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      ingress-ready: "true"   # ingress-nginx's kind manifest schedules only on nodes with this label
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
