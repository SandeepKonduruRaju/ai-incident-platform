# EXAMPLE ONLY: the key names of the Secrets the manifests expect, with placeholder values.
# Not part of any kustomization and never applied. The real Secrets are created by
#   .\scripts\k8s-secrets.ps1     (called by k8s-up.ps1)
# from incident-service/.env and investigation-worker/.env (values generated for local use when a key is
# missing). Never commit real values; k8s/**/*.secret.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: incident-platform
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: incident-service-secrets
  namespace: incident-platform
type: Opaque
stringData:
  DB_PASSWORD: CHANGE_ME                     # same value as POSTGRES_PASSWORD
  JWT_SECRET: CHANGE_ME_32_BYTES_OR_MORE
  INTERNAL_API_TOKEN: CHANGE_ME              # same value as in worker-secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
  namespace: incident-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://incident_app:CHANGE_ME@postgres:5432/incident_platform
  INTERNAL_API_TOKEN: CHANGE_ME
  # Only with k8s-secrets.ps1 -WithAnthropicKey (and LLM_PROVIDER=anthropic in the overlay):
  # ANTHROPIC_API_KEY: CHANGE_ME
