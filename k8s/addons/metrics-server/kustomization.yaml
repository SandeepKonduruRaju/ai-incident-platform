# metrics-server (CPU/memory for kubectl top and the HPA), pinned release, patched for kind:
# kind's kubelets serve self-signed certificates, so metrics-server must skip their verification.
# Local only: on EKS, metrics-server runs with properly signed kubelet certificates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

patches:
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
