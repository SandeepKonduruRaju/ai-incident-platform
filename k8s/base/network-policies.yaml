# Who may connect to whom inside the namespace (ingress rules; egress is left open). Enforced on kind by its
# default CNI (kindnet, since kind v0.24). Probes from the kubelet are not affected.

# The worker's internal API (port 8000): only incident-service pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: investigation-worker-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: investigation-worker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: incident-service
      ports:
        - port: 8000
          protocol: TCP
---
# PostgreSQL: only pods labelled as database clients (incident-service, worker, worker-ingest).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access.incident-platform/postgres: "true"
      ports:
        - port: 5432
          protocol: TCP
---
# Kafka: only pods labelled as Kafka clients (incident-service, worker, kafka-topics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access.incident-platform/kafka: "true"
      ports:
        - port: 9092
          protocol: TCP
---
# The public API (8080): only from the ingress controller. The management port (8081) gets no rule, so
# nothing can reach it until a Prometheus is deployed and allowed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incident-service-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: incident-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
