# Redis for incident-service (milestone 4): cache of finished investigations + per-tenant rate limit.
# A pure cache: no persistence, bounded memory with LRU eviction, one replica. If it is down, incident-service
# fails open (reads go to the worker, no rate limit), so a Deployment (not a StatefulSet) is enough.
# NOT PRODUCTION: in AWS this is ElastiCache (infra/modules/elasticache, off by default).
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate   # a cache: no point running two empty ones side by side during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999        # the "redis" user of the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.3-alpine   # same image as compose.yaml
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi   # maxmemory 64mb + Redis overhead
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data   # the image's working directory; nothing is persisted (--save "")
      volumes:
        - name: data
          emptyDir: {}
