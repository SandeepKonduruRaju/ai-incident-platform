# Public routes: http://localhost/api/... -> incident-service:8080, everything else -> the web UI (milestone 4B).
# Same host for both, so the UI calls /api on its own origin: no CORS. The worker's internal API, the actuator
# port, Postgres and Kafka are not reachable from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-platform
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: incident-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
