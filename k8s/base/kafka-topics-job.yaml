# Creates the topics (auto-create is off on the broker). Idempotent (--if-not-exists): safe to run again.
# Waits for the broker itself, so it can be applied together with the Kafka StatefulSet.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    app.kubernetes.io/name: kafka-topics
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600   # removed after 10 min; the next apply recreates (and harmlessly reruns) it
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        access.incident-platform/kafka: "true"
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          image: apache/kafka:4.1.0
          env:
            - name: LOG_DIR
              value: /tmp
          command: ["sh", "-c"]
          args:
            - |
              set -e
              BIN=/opt/kafka/bin
              until $BIN/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "waiting for kafka:9092"; sleep 3
              done
              for topic in incident-events incident-events.DLQ; do
                $BIN/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$topic" --partitions 3 --replication-factor 1
              done
              $BIN/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic incident-events
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
