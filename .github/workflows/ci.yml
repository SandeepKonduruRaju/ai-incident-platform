# CI for both services. Needs no secrets: tests use LLM_PROVIDER=fake and Testcontainers on the runner's Docker.
#
# Action pinning: GitHub-owned actions (actions/*) are pinned to their major version tag (maintained by
# GitHub, get security fixes). The one third-party action is pinned to a full commit SHA, because a tag
# can be moved by its owner and the action could then run different code with access to this repo.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists PR files through the API
    outputs:
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      k8s: ${{ steps.filter.outputs.k8s }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            java:
              - 'incident-service/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            python:
              - 'investigation-worker/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            k8s:
              - 'k8s/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'

  k8s:
    name: Kubernetes manifests
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KUBECONFORM_VERSION: v0.8.0
      # sha256 of kubeconform-linux-amd64.tar.gz from the release's CHECKSUMS file
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      KUBERNETES_VERSION: 1.37.0   # the kind node image in k8s/kind-config.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform (checksum verified)
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz             "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform

      # Renders the overlay without a cluster (kubectl's built-in kustomize) and validates every resource
      # against the Kubernetes JSON schemas: unknown fields, wrong types and missing required fields fail.
      - name: Render and validate the overlays (local, gitops) and the Argo CD objects
        run: |
          for overlay in local gitops; do
            kubectl kustomize "k8s/overlays/$overlay" > "/tmp/$overlay.yaml"
            /tmp/kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" "/tmp/$overlay.yaml"
            {
              echo "### Kubernetes manifests (k8s/overlays/$overlay)"
              echo
              grep '^kind:' "/tmp/$overlay.yaml" | sort | uniq -c | awk '{print "- " $2 ": " $1}'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # Application / AppProject are CRDs: their schemas come from the community CRD catalog.
          /tmp/kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s/argocd/

  terraform:
    name: Terraform (infra)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Static checks only: no backend, no AWS credentials, nothing is planned or applied.
    env:
      TF_IN_AUTOMATION: "true"
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.64.0
      TRIVY_IMAGE: aquasec/trivy:0.76.0
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform init (no backend) + validate
        run: |
          for root in infra/bootstrap infra/envs/demo; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

      - name: tflint (with the AWS ruleset)
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the job's own token: avoids GitHub rate limits when tflint downloads its plugin
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/infra -e GITHUB_TOKEN --entrypoint sh "$TFLINT_IMAGE" -c '
            tflint --init --config /repo/infra/.tflint.hcl &&
            for root in bootstrap envs/demo; do tflint --chdir="$root" --config=/repo/infra/.tflint.hcl --format=compact || exit 1; done'

      - name: Security scan report (trivy config, all severities)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" config --quiet --skip-dirs "**/.terraform" --format table --exit-code 1 infra > trivy-config.txt 2>&1 || rc=$?
          {
            echo "### Terraform security scan (trivy config)"
            echo
            if [ "$rc" -ne 0 ]; then
              echo '<details><summary>Unaccepted findings (all severities)</summary>'; echo; echo '```'; cat trivy-config.txt; echo '```'; echo '</details>'
            else
              echo "No unaccepted findings."
            fi
            echo
            echo "**Accepted findings** (inline \`#trivy:ignore\` with the reason):"
            echo
            # shellcheck disable=SC2016  # backticks inside single quotes are literal Markdown, not expansions
            grep -rn --include='*.tf' --exclude-dir=.terraform '#trivy:ignore:' infra | sed -E 's/^([^:]+):([0-9]+):#trivy:ignore:([A-Z0-9-]+) (.*)$/- `\3` \1:\2 - \4/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Security gate (fail on HIGH/CRITICAL not accepted inline)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$TRIVY_IMAGE" config --quiet --skip-dirs "**/.terraform" --severity HIGH,CRITICAL --exit-code 1 infra

  java:
    name: incident-service (Java)
    needs: changes
    # Pull requests to main always run both jobs (they are the required checks).
    if: github.event_name == 'pull_request' || needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: incident-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: incident-service/pom.xml

      # mvnw is stored in git without the executable bit (mode 100644).
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test (unit + Testcontainers integration tests)
        run: ./mvnw -B -ntp -Dmaven.wagon.http.retryHandler.count=3 verify

      - name: Test summary and proof that the integration tests ran
        if: ${{ !cancelled() }}
        run: >
          python3 ../.github/scripts/check_junit.py target/surefire-reports
          --title "incident-service tests"
          --require-passed IncidentApiIntegrationTest
          --require-passed OutboxKafkaIntegrationTest

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: incident-service/target/surefire-reports/
          retention-days: 14

  python:
    name: investigation-worker (Python)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: investigation-worker
    env:
      LLM_PROVIDER: fake                       # tests/conftest.py forces it too; no API key anywhere
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed   # fastembed's own default lookup
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed    # the app's setting, same folder
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            investigation-worker/requirements.txt
            investigation-worker/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # ~150 MB of ONNX models (embedding + cross-encoder) downloaded from Hugging Face on a cache miss.
      - name: Cache fastembed models
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-${{ hashFiles('investigation-worker/requirements.txt') }}
          restore-keys: fastembed-${{ runner.os }}-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Tests (unit + Testcontainers integration)
        run: python -m pytest -q -rs --junitxml=test-results/pytest.xml

      - name: Eval pipeline smoke test (FakeLLM)
        run: python -m pytest -m eval_smoke -q --junitxml=test-results/eval-smoke.xml

      - name: Test summary and proof that the integration tests ran
        if: ${{ !cancelled() }}
        run: >
          python ../.github/scripts/check_junit.py test-results/pytest.xml
          --title "investigation-worker tests"
          --allow-skip "^live LLM test"
          --require-passed tests.test_search_integration
          --require-passed tests.test_search_relevance
          --require-passed tests.test_consumer_integration
          --require-passed tests.test_investigation_integration
          --require-passed tests.test_eval_smoke

      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-junit
          path: investigation-worker/test-results/
          retention-days: 14

  docker:
    name: image (${{ matrix.image }})
    needs: [changes, java, python]
    # After the test jobs: none failed, and at least one of them ran (a job skipped by the path filter is fine).
    # Both images are built every time: unchanged ones are pure cache hits, and main gets a full set of tags.
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.java.result == 'success' || needs.python.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to ghcr.io (only used on main; GITHUB_TOKEN, no stored secret)
    strategy:
      fail-fast: false
      matrix:
        image: [incident-service, investigation-worker]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry paths must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      # Build once into the runner's Docker (load) so it can be scanned BEFORE anything is published.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Vulnerability report (HIGH + CRITICAL, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Vulnerability report to job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Trivy: ${{ matrix.image }} (HIGH and CRITICAL)"
            echo "<details><summary>Full report</summary>"
            echo
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "no report"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate: fail only on CRITICAL vulnerabilities that already have a fix (actionable).
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
          # Documented, time-limited exceptions only (each with its reason and an expiry date).
          trivyignores: .trivyignore

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer comes from the cache; this only uploads.
      - name: Push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=${{ matrix.image }}

  gitops-bump:
    name: GitOps image bump PR
    needs: docker
    # Only after BOTH images of this commit were pushed to GHCR (push to main); never for pull requests.
    # No loop: merging the bump PR changes only k8s/overlays/gitops, so the java/python jobs are skipped by the
    # path filter, the image job (which needs one of them) is skipped, and so is this job. The commit-message
    # check is a second guard.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.docker.result == 'success'
      && !startsWith(github.event.head_commit.message, 'deploy(gitops)')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open/update the PR (main itself is never pushed to: branch protection)
    steps:
      - uses: actions/checkout@v7

      # App images always move to this commit; the worker-ingest Job's image and data hash only when
      # investigation-worker/data/synthetic changed (so a release does not re-run the ingest).
      - name: Point k8s/overlays/gitops at ${{ github.sha }}
        run: |
          python3 scripts/gitops-bump.py --sha "$GITHUB_SHA"
          git diff -- k8s/overlays/gitops/kustomization.yaml

      # One rolling PR on branch gitops/image-bump: a newer push to main updates it instead of opening another.
      # Merging it is the deployment (Argo CD syncs main). Note: PRs created with the default GITHUB_TOKEN do not
      # trigger workflows; to get CI checks on the PR, add a fine-grained token as the optional repository secret
      # GITOPS_PR_TOKEN (contents + pull requests: read/write on this repository only).
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN || github.token }}
          branch: gitops/image-bump
          delete-branch: true
          add-paths: k8s/overlays/gitops/kustomization.yaml
          commit-message: "deploy(gitops): images ${{ github.sha }}"
          title: "deploy(gitops): images ${{ github.sha }}"
          body: |
            Deploys `ghcr.io/${{ github.repository_owner }}/incident-service` and `.../investigation-worker` at
            `${{ github.sha }}` (built, scanned and pushed by CI run ${{ github.run_id }}).

            **Merging this PR deploys it**: Argo CD syncs `k8s/overlays/gitops` from main.
            Roll back by reverting the merge commit of the previous bump.
