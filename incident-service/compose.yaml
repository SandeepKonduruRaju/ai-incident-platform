services:
  postgres:
    # PostgreSQL 18 + the pgvector extension. "-trixie" = Debian 13, the same base as the former
    # postgres:18 image, so the existing data directory keeps the same glibc collation rules.
    image: pgvector/pgvector:pg18-trixie
    container_name: incidents-db
    environment:
      POSTGRES_DB: incident_platform
      POSTGRES_USER: incident_app
      POSTGRES_PASSWORD: localpass
    ports:
      - "5433:5432"
    volumes:
      - incidents-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_app -d incident_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: incidents-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Without this the image writes to /tmp/kafka-logs inside the container, so every
      # recreate lost all topics and messages. Point it at the mounted volume instead.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Starts a JVM per probe: ~2s when idle, ~10s on a busy laptop, hence the generous timeout.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 15s

  # One-shot job: auto-create is off, so topics are created explicitly (idempotent: --if-not-exists).
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: incidents-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic incident-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic incident-events.DLQ --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  investigation-worker:
    build:
      context: ../investigation-worker
    image: investigation-worker:local
    container_name: investigation-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      # Inside the compose network: service names and the INTERNAL listener, not localhost.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Local-dev password only (same one as POSTGRES_PASSWORD above).
      DATABASE_URL: postgresql+asyncpg://incident_app:localpass@postgres:5432/incident_platform
      LOG_LEVEL: INFO
      # From the HOST environment, never written here. Default fake: the stack runs without a key or cost.
      # Real Claude: $env:LLM_PROVIDER="anthropic"; $env:ANTHROPIC_API_KEY="..." before docker compose up.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Shared secret for GET /internal/v1/* (incident-service sends it as X-Internal-Token).
      # DEV-ONLY default; incident-service must use the same value ($env:INTERNAL_API_TOKEN).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-only-internal-token-change-me}
      # Observability (section 3.4): /metrics on 9464 (inside the network only, scraped by Prometheus);
      # traces to the collector when TRACING_EXPORT_ENABLED=true (with --profile observability).
      METRICS_PORT: "9464"
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8001:8000"
    healthcheck:
      # The slim image has no curl; urlopen raises on 503 (consumer not alive), so the check fails.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot job: load the synthetic evidence into worker.chunks (chunk, embed, upsert), then exit.
  # Waits for the worker to be healthy, which means its "alembic upgrade head" has created worker.chunks.
  # Idempotent (deterministic chunk ids + upsert), so it is safe on every "docker compose up".
  worker-ingest:
    image: investigation-worker:local   # same image as investigation-worker (model baked in); built there
    pull_policy: never                  # local image only: never try Docker Hub
    container_name: investigation-worker-ingest
    depends_on:
      investigation-worker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://incident_app:localpass@postgres:5432/incident_platform
    command: ["python", "-m", "app.ingest"]
    restart: "no"

  # The Java API, built from ./Dockerfile. "docker compose up -d --build" now starts the whole stack.
  # To run it with .\mvnw.cmd spring-boot:run instead: "docker compose stop incident-service" first (it
  # uses port 8080), or publish this container elsewhere with $env:INCIDENT_SERVICE_PORT = "8081".
  incident-service:
    build:
      context: .
    image: incident-service:local
    container_name: incident-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully   # topics exist before the outbox relay sends
      investigation-worker:
        condition: service_healthy
    environment:
      # Inside the compose network: service names and the INTERNAL Kafka listener, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/incident_platform
      DB_USERNAME: incident_app
      DB_PASSWORD: localpass   # local container only (same as POSTGRES_PASSWORD above)
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVESTIGATION_WORKER_BASE_URL: http://investigation-worker:8000
      # DEV-ONLY defaults (local stack only), overridable from the host environment or incident-service/.env.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-only-internal-token-change-me}
      # dev = enables POST /api/v1/dev/token; never set it in a real deployment.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Observability (section 3.4): actuator (health, prometheus) on 8081, NOT published on the host:
      # only Prometheus reaches it inside the network. Traces to the collector when TRACING_EXPORT_ENABLED=true.
      MANAGEMENT_PORT: "8081"
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "${INCIDENT_SERVICE_PORT:-8080}:8080"
    # The image's HEALTHCHECK (curl /api/v1/health) is used as is.

  # ---------------------------------------------------------------- observability profile (section 3.4)
  # Off by default so the normal stack stays light. Start with:
  #   $env:TRACING_EXPORT_ENABLED = "true"; docker compose --profile observability up -d --build
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector:0.163.1
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.22.0   # all-in-one: OTLP in, in-memory storage, UI
    container_name: jaeger
    ports:
      - "16686:16686"   # UI

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    # Rule files cannot read env vars: fill the cost threshold into the template, then start Prometheus.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /prometheus/generated &&
        sed 's/__LLM_COST_ALERT_USD_PER_HOUR__/${LLM_COST_ALERT_USD_PER_HOUR:-1}/g'
        /etc/prometheus/rules/llm-cost.yml.tpl > /prometheus/generated/llm-cost.yml &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.4
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # DEV-ONLY default; set GRAFANA_ADMIN_PASSWORD in the host environment or incident-service/.env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-grafana-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-incident-platform.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "3000:3000"

volumes:
  incidents-data:
  kafka-data:
  prometheus-data:
