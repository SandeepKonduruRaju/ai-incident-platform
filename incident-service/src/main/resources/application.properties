spring.application.name=incident-service

# PostgreSQL. Credentials come from environment variables, never from this file.
# DB_PASSWORD has no default on purpose: the app fails fast if it is not set.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incident_platform}
spring.datasource.username=${DB_USERNAME:incident_app}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Every log line shows the request id set by RequestIdFilter (empty outside a request).
logging.pattern.level=%5p [requestId=%X{requestId:-} traceId=%X{traceId:-}]
# traceId is in the level pattern above, so Boot's default "[traceId-spanId]" correlation block is switched off.
logging.pattern.correlation=

# JWT validation. JWT_SECRET (min 32 bytes) has no default: the app fails fast if it is not set.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=incident-platform
app.security.jwt.token-ttl=1h

# --- Kafka producer ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000

# --- Outbox relay (sends outbox_events rows to Kafka) ---
outbox.relay.enabled=true
outbox.relay.delay-ms=1000

# --- Investigation worker (internal read API, section 2.7) ---
# INTERNAL_API_TOKEN has no default: the app fails fast if it is not set (same value as the worker's).
investigation.worker.base-url=${INVESTIGATION_WORKER_BASE_URL:http://localhost:8001}
investigation.worker.token=${INTERNAL_API_TOKEN}
investigation.worker.connect-timeout=1s
investigation.worker.read-timeout=3s

# --- Observability (section 3.4) ---
# Actuator on its own port: only health and prometheus, never on the public API port (8080).
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# Histogram buckets for the API latency (p95 in Grafana); "uri" is the route template, so cardinality stays low.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
# Metrics are scraped by Prometheus (pull); the OTLP metrics push from the OpenTelemetry starter stays off.
management.otlp.metrics.export.enabled=false
# Tracing: spans and W3C propagation always on (trace ids in logs and headers); only the OTLP export
# to the collector is switched by TRACING_EXPORT_ENABLED (Boot turns propagation off with the global
# management.tracing.export.enabled, so that one stays on).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.otlp.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# The outbox relay polls every second: a trace per poll would drown the real ones. Its spans are created
# explicitly per sent event instead (OutboxRelay), continuing the request's trace.
management.observations.enable.tasks.scheduled=false
