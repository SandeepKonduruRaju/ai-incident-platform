spring.application.name=incident-service

# Tests use in-memory H2 (PostgreSQL mode) so they need no database server or credentials.
# This file shadows src/main/resources/application.properties on the test classpath.
# Flyway still runs the real migrations, so they are checked on every test run.
spring.datasource.url=jdbc:h2:mem:incident_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.pattern.level=%5p [requestId=%X{requestId:-} traceId=%X{traceId:-}]

# Test-only signing secret (not used anywhere else).
app.security.jwt.secret=test-only-jwt-secret-0123456789abcdef
app.security.jwt.issuer=incident-platform
app.security.jwt.token-ttl=1h

# No Kafka in tests: the outbox relay bean is not created, so outbox rows stay unsent.
outbox.relay.enabled=false

# Investigation worker: never called by these tests (slice tests mock it); test-only token.
investigation.worker.base-url=http://investigation-worker.test
investigation.worker.token=test-only-internal-token

# Observability, as in the main file (section 3.4). The management port stays the app port here
# (MockMvc tests); ObservabilityEndpointsTest moves it to a random port of its own.
management.endpoints.web.exposure.include=health,prometheus
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.observations.enable.tasks.scheduled=false

# No Redis in tests by default: no cache, no rate limit. The Redis tests switch them on themselves.
management.health.redis.enabled=false
app.redis.cache.enabled=false
app.redis.rate-limit.enabled=false

# Web UI (milestone 4B): CorsTest sets its own allowed origin.
app.cors.allowed-origins=
