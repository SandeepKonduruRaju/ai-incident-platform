[pytest]
# Put the project root on the import path so tests can "import app".
pythonpath = .
testpaths = tests
# pytest-asyncio: "async def test_..." functions run on an event loop without a decorator.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    integration: needs Docker (Kafka and PostgreSQL containers)
    eval_smoke: fast end-to-end run of the evaluation pipeline with FakeLLM (no Docker, no network)
