# OpenTelemetry Collector: receives OTLP traces from incident-service and investigation-worker and
# forwards them to Jaeger. Services talk only to the collector, so the trace backend can be swapped
# (Tempo, a SaaS) without touching application config.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protects the collector from running out of memory under a burst of spans.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true   # inside the compose network only

service:
  telemetry:
    # The collector's own metrics (spans received/exported/dropped), scraped by Prometheus.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
