# Prometheus for the local "observability" compose profile. Scrapes the services' metrics ports, which
# are reachable only inside the compose network (never published on the host).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Milestone 4: firing alerts go to Alertmanager (same compose profile), which routes them to receivers.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml
  # Generated at container start from rules/llm-cost.yml.tpl with LLM_COST_ALERT_USD_PER_HOUR (compose).
  - /prometheus/generated/*.yml

scrape_configs:
  - job_name: incident-service
    metrics_path: /actuator/prometheus   # management port 8081, not the API port
    static_configs:
      - targets: ["incident-service:8081"]

  - job_name: investigation-worker
    static_configs:
      - targets: ["investigation-worker:9464"]   # prometheus_client server, not the API port

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
